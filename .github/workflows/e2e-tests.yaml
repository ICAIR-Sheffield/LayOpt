name: End-to-end tests (weekly)

on:
  schedule:
    # run every Monday at 3am UTC
    - cron: "0 3 * * 1"
  workflow_dispatch: # allow manual run via Actions

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    name: E2E (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # so one failed job doesn't cancel remaining
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true
          python-version: ${{ matrix.python-version }}
      - name: Install the package
        run: |
          uv sync --locked --all-extras --dev
      - name: Run end-to-end tests
        run: |
          uv run pytest -m e2e --numprocesses=logical tests

      - name: Setup tmate session
        if: ${{ failure() }}
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 5
